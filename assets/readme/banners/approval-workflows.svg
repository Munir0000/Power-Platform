<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Approval Workflows: custom, sequential, parallel and Teams card approvals">
<style>
  .name{font:700 54px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF;letter-spacing:1px}
  .role{font:500 26px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#E0F2FE}
  .tag{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#BAE6FD;letter-spacing:4px}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B1E4A"><animate attributeName="stop-color" values="#0B1E4A;#3B0B5E;#0B1E4A" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#5B2BA6"><animate attributeName="stop-color" values="#5B2BA6;#0E5A8A;#5B2BA6" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#0E7490"><animate attributeName="stop-color" values="#0E7490;#7E22CE;#0E7490" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <clipPath id="c0"><rect x="80" y="152" height="46" width="0"><animate attributeName="width" values="0;702;702;0" keyTimes="0;0.25;0.85;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1200" height="260" rx="18" fill="url(#bg)"/>
<circle cx="980" cy="80" r="110" fill="url(#glow)"><animate attributeName="cy" values="80;110;80" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1110" cy="200" r="75" fill="url(#glow)"><animate attributeName="cx" values="1110;1070;1110" dur="9s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2">
  <rect x="900" y="60" width="70" height="70" rx="14"><animateTransform attributeName="transform" type="rotate" values="12 935 95;372 935 95" dur="30s" repeatCount="indefinite"/></rect>
  <circle cx="1040" cy="150" r="34"><animate attributeName="r" values="34;42;34" dur="5s" repeatCount="indefinite"/></circle>
  <path d="M1080 50 l30 52 h-60z"><animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="6s" repeatCount="indefinite"/></path>
</g>
<text x="82" y="78" class="tag">POWER AUTOMATE · APPROVALS · TEAMS</text>
<text x="78" y="140" class="name">Approval Workflows</text>
<text x="80" y="184" clip-path="url(#c0)" class="role">Custom, sequential, parallel and Teams card approvals</text>
<rect y="160" width="3" height="30" fill="#7DD3FC"><animate attributeName="x" values="86;788;788;86" keyTimes="0;0.25;0.85;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
<rect x="80" y="214" width="0" height="4" rx="2" fill="#7DD3FC"><animate attributeName="width" values="0;260;260" keyTimes="0;0.15;1" dur="4s" fill="freeze"/></rect>
</svg>
